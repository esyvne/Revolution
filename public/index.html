<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Revolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0a0a0b;
      --surface: #111113;
      --surface2:#18181b;
      --hover:   #1e1e22;
      --text:    #e4e4e7;
      --text2:   #a1a1aa;
      --muted:   #71717a;
      --border:  rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --green:   #4ade80;
      --red:     #f87171;
      --r-sm:8px; --r-md:12px; --r-lg:16px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    ::selection { background:rgba(255,255,255,0.12); color:#fff; }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:3px; }
    body {
      font-family:'Space Grotesk',system-ui,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }

    nav {
      position:sticky; top:0; z-index:100;
      background:var(--bg); border-bottom:1px solid var(--border);
      padding:0 2rem; height:56px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .nav-logo {
      display:flex; align-items:center; gap:0.6rem;
      font-size:1rem; font-weight:700; letter-spacing:-0.3px;
    }
    .nav-logo svg { width:20px; height:20px; flex-shrink:0; }
    .nav-meta { font-size:0.75rem; color:var(--muted); }

    main { max-width:1100px; margin:0 auto; padding:2.5rem 2rem 6rem; }
    .section-label {
      font-size:0.65rem; font-weight:600; text-transform:uppercase;
      letter-spacing:2px; color:var(--muted); margin-bottom:1.25rem;
    }

    #games-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:0.85rem;
    }
    .game-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); overflow:hidden; cursor:pointer;
      transition:border-color .18s ease;
    }
    .game-card:hover { border-color:var(--border2); }
    .thumb { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--surface2); display:block; }
    .thumb-ph {
      width:100%; aspect-ratio:1/1; background:var(--surface2);
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-size:2.5rem;
    }
    .card-body { padding:1.1rem 1.1rem 0.9rem; }
    .card-name {
      font-weight:600; font-size:0.95rem;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:0.55rem;
    }
    .card-meta { display:flex; gap:0.45rem; flex-wrap:wrap; }
    .badge {
      display:inline-flex; align-items:center; gap:0.3rem;
      font-size:0.65rem; font-weight:600; padding:0.2rem 0.55rem; border-radius:999px;
    }
    .badge-green  { color:var(--green);  border:1px solid rgba(74,222,128,0.2); }
    .badge-purple { color:#a78bfa;       border:1px solid rgba(167,139,250,0.2); }
    .card-foot {
      padding:0.65rem 1.1rem; border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .card-id { font-size:0.65rem; color:var(--muted); font-family:monospace; }
    .btn-sm {
      display:inline-flex; align-items:center; gap:0.3rem;
      font-size:0.7rem; font-weight:600; color:var(--muted);
      background:var(--surface2); border:1px solid var(--border);
      padding:0.28rem 0.65rem; border-radius:var(--r-sm);
      transition:all .15s ease; cursor:pointer; font-family:inherit;
    }
    .btn-sm:hover { color:var(--text); border-color:var(--border2); }

    .empty { grid-column:1/-1; padding:5rem 0; text-align:center; color:var(--muted); }
    .empty i { font-size:2rem; margin-bottom:0.9rem; display:block; }
    .empty p  { font-size:0.9rem; }

    .overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(6px);
      z-index:200; align-items:center; justify-content:center;
    }
    .overlay.open { display:flex; }
    .modal {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); width:480px; max-width:95vw;
      max-height:88vh; overflow-y:auto; animation:up .18s ease;
    }
    @keyframes up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .modal-head {
      padding:1.1rem 1.4rem; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-head h2 { font-size:0.95rem; font-weight:700; }
    .modal-close {
      background:none; border:none; color:var(--muted); cursor:pointer;
      padding:0.2rem 0.35rem; border-radius:var(--r-sm); font-size:1rem; transition:all .15s ease;
    }
    .modal-close:hover { color:var(--text); background:var(--surface2); }
    .modal-body { padding:1.1rem 1.4rem; }
    .srv-list { display:flex; flex-direction:column; gap:0.5rem; }
    .srv-item {
      display:flex; align-items:center; gap:0.9rem;
      padding:0.85rem 1rem; background:var(--surface2);
      border:1px solid var(--border); border-radius:var(--r-md);
      text-decoration:none; color:inherit; transition:border-color .15s ease;
    }
    .srv-item:hover { border-color:var(--border2); }
    .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot.on { background:var(--green); box-shadow:0 0 5px var(--green); }
    .srv-info { flex:1; min-width:0; }
    .srv-sid {
      font-size:0.65rem; color:var(--muted); font-family:monospace;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .srv-pc { font-size:0.82rem; font-weight:600; margin-top:0.1rem; }
    .srv-label { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--green); }

    /* ── User pill ── */
    #user-pill {
      position:fixed; bottom:1rem; left:1rem; z-index:150;
      display:flex; align-items:center; gap:0.6rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-md); padding:0.5rem 0.75rem;
      min-width:160px; max-width:220px;
      transition:border-color .15s ease;
    }
    #user-pill:hover { border-color:var(--border2); }
    #user-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--surface2); overflow:hidden; flex-shrink:0;
      border:1px solid var(--border);
    }
    #user-avatar img { width:100%; height:100%; object-fit:cover; }
    #user-info { flex:1; min-width:0; }
    #user-name {
      font-size:0.82rem; font-weight:600;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    #user-tag { font-size:0.65rem; color:var(--muted); }
    .logout-btn {
      background:none; border:none; color:var(--muted);
      cursor:pointer; padding:0.2rem; border-radius:4px;
      font-size:0.7rem; transition:color .15s ease; flex-shrink:0;
    }
    .logout-btn:hover { color:var(--red); }

    footer {
      text-align:center; padding:1.75rem;
      color:var(--muted); font-size:0.75rem;
      border-top:1px solid var(--border); margin-top:1.5rem;
    }
    @media(max-width:640px){ nav,main { padding-left:1.25rem; padding-right:1.25rem; } }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <svg viewBox="0 0 346 396" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M173 373L323 286.768V109.232L173 23L23 109.232V286.768L173 373ZM173 23V109.232M323 109.232L173 195.464L106.898 161.225L23 286.768M173 373L249.271 241.116" stroke="white" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Revolution
  </div>
  <div class="nav-meta" id="nav-meta">Loading…</div>
</nav>

<main>
  <div class="section-label">Active games</div>
  <div id="games-grid">
    <div class="empty"><i class="fas fa-gamepad"></i><p>Waiting for Roblox connections…</p></div>
  </div>
</main>

<footer>Revolution — made by uncleansable</footer>

<!-- User pill -->
<div id="user-pill">
  <div id="user-avatar"><img id="user-avatar-img" src="" alt=""/></div>
  <div id="user-info">
    <div id="user-name">…</div>
    <div id="user-tag"></div>
  </div>
  <button class="logout-btn" title="Sign out" onclick="location.href='/auth/logout'">
    <i class="fas fa-sign-out-alt"></i>
  </button>
</div>

<!-- Server modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Select a server</h2>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="srv-list" id="srv-list"></div>
    </div>
  </div>
</div>

<script>
const $   = id => document.getElementById(id);
const esc = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function loadUser() {
  try {
    const me = await fetch('/api/me').then(r => r.json());
    $('user-name').textContent = me.username;
    $('user-tag').textContent  = me.discriminator && me.discriminator !== '0'
      ? `#${me.discriminator}`
      : 'Discord';
    const avatarUrl = me.avatar
      ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=64`
      : `https://cdn.discordapp.com/embed/avatars/0.png`;
    $('user-avatar-img').src = avatarUrl;
  } catch(_) {}
}

async function refresh() {
  try {
    const games = await fetch('/api/games').then(r => r.json());
    render(games);
    const ts = games.reduce((a,g) => a + g.servers.length, 0);
    const tp = games.reduce((a,g) => a + g.servers.reduce((b,s) => b + (s.players||[]).length, 0), 0);
    $('nav-meta').textContent = `${games.length} game${games.length!==1?'s':''} · ${ts} server${ts!==1?'s':''} · ${tp} player${tp!==1?'s':''}`;
  } catch(_) {}
}

function render(games) {
  const grid = $('games-grid');
  if (!games.length) {
    grid.innerHTML = `<div class="empty"><i class="fas fa-gamepad"></i><p>Waiting for Roblox connections…</p></div>`;
    return;
  }
  grid.innerHTML = '';
  for (const g of games) {
    const pc = g.servers.reduce((a,s) => a + (s.players||[]).length, 0);
    const sc = g.servers.length;
    const c  = document.createElement('div');
    c.className = 'game-card';
    c.onclick   = () => openModal(g);
    c.innerHTML = `
      ${g.gameThumb
        ? `<img class="thumb" src="${esc(g.gameThumb)}" alt="${esc(g.gameName)}" loading="lazy"/>`
        : `<div class="thumb-ph"><i class="fas fa-gamepad"></i></div>`}
      <div class="card-body">
        <div class="card-name" title="${esc(g.gameName)}">${esc(g.gameName)}</div>
        <div class="card-meta">
          <span class="badge badge-green"><i class="fas fa-users"></i> ${pc} player${pc!==1?'s':''}</span>
          <span class="badge badge-purple"><i class="fas fa-server"></i> ${sc} server${sc!==1?'s':''}</span>
        </div>
      </div>
      <div class="card-foot">
        <span class="card-id">ID: ${esc(g.gameId)}</span>
        <a href="https://www.roblox.com/games/${esc(g.gameId)}" target="_blank"
           class="btn-sm" onclick="event.stopPropagation()">
          Roblox <i class="fas fa-external-link-alt"></i>
        </a>
      </div>`;
    grid.appendChild(c);
  }
}

function openModal(game) {
  $('modal-title').textContent = game.gameName;
  const list = $('srv-list');
  list.innerHTML = '';
  for (const sv of game.servers) {
    const pc = (sv.players||[]).length;
    const a  = document.createElement('a');
    a.className = 'srv-item';
    a.href      = `/game/${game.gameId}/${sv.serverId}/`;
    a.innerHTML = `
      <div class="dot on"></div>
      <div class="srv-info">
        <div class="srv-sid">${esc(sv.serverId)}</div>
        <div class="srv-pc">${pc} player${pc!==1?'s':''}</div>
      </div>
      <span class="srv-label">Online</span>`;
    list.appendChild(a);
  }
  $('overlay').classList.add('open');
}

function closeModal() { $('overlay').classList.remove('open'); }
$('overlay').addEventListener('click', e => { if (e.target===$('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

loadUser();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
