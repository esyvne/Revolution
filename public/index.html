<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="api-base" content="https://YOUR-VERCEL-PROJECT.vercel.app" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; img-src 'self'; script-src 'self'; connect-src 'self' https://*.vercel.app; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Early</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tao-page">
    <main class="tao-content">
      <div class="login-container">
        <div class="logo-container">
          <div class="logo-frame"><span class="logo-r">E</span></div>
        </div>
        <section class="login-box">
          <h1>Connectez-vous à la plateforme Early</h1>
          <form id="login-form" autocomplete="on">
            <div class="field">
              <label for="username">Utilisateur <abbr>*</abbr></label
              ><input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus
              />
            </div>
            <div class="field">
              <label for="password">Mot de passe <abbr>*</abbr></label
              ><input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="login-button" type="submit">Se connecter</button>
            <p class="login-error" id="login-error" role="alert">
              Identifiants incorrects. Veuillez réessayer.
            </p>
          </form>
        </section>
      </div>
    </main>
    <footer class="dark-bar">
      <span>© Contenu : Early · Tous droits réservés</span
      ><span>© Early Platform: 2026 · Tous droits réservés</span>
    </footer>
    <div class="loading-bar"></div>
    <script src="app.js" defer></script>
  </body>
</html>
