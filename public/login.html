<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Revolution · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0a0a0b;
      --surface: #111113;
      --border:  rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --text:    #e4e4e7;
      --muted:   #71717a;
      --red:     #f87171;
      --discord: #5865f2;
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    ::selection { background:rgba(255,255,255,0.12); color:#fff; }
    body {
      font-family:'Space Grotesk',system-ui,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      -webkit-font-smoothing:antialiased; padding:1.5rem;
    }
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); padding:2.5rem 2rem;
      width:100%; max-width:360px; text-align:center;
    }
    .logo {
      display:inline-flex; align-items:center; justify-content:center;
      width:52px; height:52px; border-radius:var(--r-md);
      background:var(--bg); border:1px solid var(--border);
      margin-bottom:1.4rem;
    }
    .logo svg { width:26px; height:26px; }
    h1 { font-size:1.15rem; font-weight:700; margin-bottom:0.4rem; }
    .sub { font-size:0.82rem; color:var(--muted); margin-bottom:2rem; }
    .btn-discord {
      display:flex; align-items:center; justify-content:center; gap:0.6rem;
      width:100%; padding:0.75rem 1rem;
      background:var(--discord); border:none; border-radius:var(--r-sm);
      color:#fff; font-family:inherit; font-size:0.88rem; font-weight:600;
      cursor:pointer; text-decoration:none;
      transition:opacity .15s ease;
    }
    .btn-discord:hover { opacity:.88; }
    .btn-discord svg { width:20px; height:20px; flex-shrink:0; }
    .error {
      display:none; margin-top:1.25rem;
      font-size:0.78rem; color:var(--red);
      background:rgba(248,113,113,0.08);
      border:1px solid rgba(248,113,113,0.2);
      padding:0.6rem 0.9rem; border-radius:var(--r-sm);
    }
    .error.show { display:block; }
    footer {
      margin-top:1.75rem; font-size:0.72rem; color:var(--muted);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 346 396" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M173 373L323 286.768V109.232L173 23L23 109.232V286.768L173 373ZM173 23V109.232M323 109.232L173 195.464L106.898 161.225L23 286.768M173 373L249.271 241.116" stroke="white" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Revolution</h1>
  <p class="sub">Sign in with Discord to access the dashboard.</p>

  <a href="/auth/discord" class="btn-discord">
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
    </svg>
    Continue with Discord
  </a>

  <div class="error" id="err"></div>
</div>

<footer>Revolution — made by uncleansable</footer>

<script>
  const params = new URLSearchParams(location.search);
  const err    = params.get('error');
  const el     = document.getElementById('err');
  if (err === 'unauthorized') {
    el.textContent = "Access denied — your Discord account is not whitelisted.";
    el.classList.add('show');
  } else if (err === 'token' || err === 'failed') {
    el.textContent = 'Authentication error. Please try again.';
    el.classList.add('show');
  }
</script>
</body>
</html>
